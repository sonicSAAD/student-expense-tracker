name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0a"
        required: true
        default: "v0.1.0a"

permissions:
  contents: write

env:
  # For tag pushes this is the tag name; for manual runs it is the requested tag.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build & Release Artifacts
    # Pinned instead of ubuntu-latest so the toolchain stays reproducible while
    # the ubuntu-latest label migrates to a new image.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Anything that is not a plain x.y.z version is a pre-release.
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Release Artifacts
        id: prepare_assets
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/student-expense-tracker-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/student-expense-tracker-$TAG.aab"
          echo "apk=dist/student-expense-tracker-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "aab=dist/student-expense-tracker-$TAG.aab" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Student Expense Tracker ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.prepare_assets.outputs.apk }}
            ${{ steps.prepare_assets.outputs.aab }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          # A pre-release can never be the "latest" release.
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
