name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0a"
        required: true
        default: "v0.1.0a"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        id: prepare_assets
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/student-expense-tracker-$TAG.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/student-expense-tracker-$TAG.aab
          echo "apk=dist/student-expense-tracker-$TAG.apk" >> $GITHUB_OUTPUT
          echo "aab=dist/student-expense-tracker-$TAG.aab" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Student Expense Tracker ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.prepare_assets.outputs.apk }}
            ${{ steps.prepare_assets.outputs.aab }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.event.inputs.tag, 'a') }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
